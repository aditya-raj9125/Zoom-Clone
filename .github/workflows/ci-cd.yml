name: Auto-Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. CD Backend: Instant Deploy to Render
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Calling Render Deploy Hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered (HTTP $HTTP_STATUS)!"
            else
              echo "⚠️ Render Deploy Hook returned HTTP status: $HTTP_STATUS"
            fi
          else
            echo "ℹ️ Commit pushed to 'main'."
            echo "Render auto-deploys branch 'main' automatically when Auto-Deploy is enabled."
            echo "Backend live URL: https://zoom-clone-hvoi.onrender.com"
            echo "To trigger via webhook directly, add RENDER_DEPLOY_HOOK_URL in GitHub Repo Secrets."
          fi

  # ---------------------------------------------------------------------------
  # 2. CD Frontend: Instant Deploy to Vercel
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deployment
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Calling Vercel Deploy Hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Vercel deployment triggered via Deploy Hook (HTTP $HTTP_STATUS)!"
            else
              echo "⚠️ Vercel Deploy Hook returned HTTP status: $HTTP_STATUS"
            fi
          else
            echo "ℹ️ Commit pushed to 'main'."
            echo "Vercel automatically deploys every commit to 'main' for project 'zoom-clone-web'."
            echo "Frontend live URL: https://zoom-clone-web-gamma.vercel.app"
          fi
