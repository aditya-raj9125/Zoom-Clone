name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend CI: Python setup, dependencies, and test suite
  # ---------------------------------------------------------------------------
  test-backend:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -e "apps/api[dev]"

      - name: Run backend test suite
        run: |
          cd apps/api
          pytest tests -v

  # ---------------------------------------------------------------------------
  # 2. Frontend CI: Node.js setup, dependencies, TypeScript & Next.js build
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Frontend Build & Typecheck (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install monorepo dependencies
        run: npm ci || npm install

      - name: Build frontend application
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: https://zoom-clone-hvoi.onrender.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://zoom-clone-hvoi.onrender.com

  # ---------------------------------------------------------------------------
  # 3. CD Backend: Deploy to Render
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend (Render)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render deployment via Deploy Hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered (HTTP $HTTP_STATUS)!"
            else
              echo "❌ Render Deploy Hook returned HTTP status: $HTTP_STATUS"
              exit 1
            fi
          else
            echo "ℹ️ Notice: RENDER_DEPLOY_HOOK_URL secret is not set in repository secrets."
            echo "If 'Auto-Deploy: Yes' is enabled in your Render service settings, Render deploys pushes to 'main' automatically."
            echo "For strict CI-gated deployment, add RENDER_DEPLOY_HOOK_URL to GitHub Repo Settings -> Secrets and variables -> Actions."
          fi

  # ---------------------------------------------------------------------------
  # 4. CD Frontend: Deploy to Vercel
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4

      - name: Deploy to Vercel via Deploy Hook or CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Vercel deployment via Deploy Hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Vercel deployment triggered via Deploy Hook (HTTP $HTTP_STATUS)!"
            else
              echo "❌ Vercel Deploy Hook returned HTTP status: $HTTP_STATUS"
              exit 1
            fi
          elif [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Deploying to Vercel via Vercel CLI..."
            npm install --global vercel@latest
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
            echo "✅ Vercel production deployment completed via CLI!"
          else
            echo "ℹ️ Notice: Vercel GitHub App integration is connected to aditya-raj9125/Zoom-Clone."
            echo "Every validated commit pushed to 'main' automatically triggers a production build on Vercel."
            echo "Frontend live URL: https://zoom-clone-web-gamma.vercel.app"
          fi
