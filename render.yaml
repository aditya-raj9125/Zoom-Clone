services:
  - type: web
    name: zoom-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: mkdir -p /tmp/zoom_data && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/zoom_data/zoom_clone.db
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
